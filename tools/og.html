<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  body{margin:0;width:1200px;height:630px;background:#f3f1ea;background-image:radial-gradient(#dcd8cc 1.6px,transparent 1.7px);background-size:34px 34px;font-family:Inter,sans-serif;color:#141a1f;position:relative;overflow:hidden}
  .card{position:absolute;inset:48px;overflow:hidden;background:#fbfaf6;border:2.5px solid #141a1f;border-radius:34px;display:flex;align-items:center;gap:56px;padding:0 72px}
  .photo{width:300px;height:300px;border-radius:52px;object-fit:cover;border:2.5px solid #141a1f;flex:none}
  .k{font:500 20px "IBM Plex Mono",monospace;color:#ff4d1f;letter-spacing:.1em;text-transform:uppercase;margin-bottom:18px}
  h1{font:900 92px/.95 Archivo,sans-serif;letter-spacing:-.045em;margin:0 0 22px}
  .role{font:800 34px Archivo,sans-serif;letter-spacing:-.02em;margin-bottom:26px}
  .role b{color:#ff4d1f;font-weight:800}
  .url{font:500 22px "IBM Plex Mono",monospace;color:#555d66}
  .tags{display:flex;gap:10px;margin-top:22px}
  .tags span{white-space:nowrap;font:500 17px "IBM Plex Mono",monospace;padding:7px 14px;border:1.5px solid #d3cfc3;border-radius:10px;background:#f3f1ea}
  .edge{position:absolute;right:-140px;top:-160px;width:420px;height:420px;z-index:0;border-radius:50%;border:2px dashed #2b59ff;opacity:.35}
</style></head><body>
<div class="card">
  <div class="edge"></div>
  <img class="photo" src="../assets/giuliano.jpg">
  <div style="position:relative;z-index:1">
    <div class="k">// architecture diagram · v2026.10</div>
    <h1>Giuliano<br>Antonanzas</h1>
    <div class="role">Tech Lead · Full Stack · <b>IA</b> &amp; <b>AWS</b></div>
    <div class="tags"><span>Equipos de 5 a 16</span><span>AWS Certified ×2</span><span>Escuelita ×2</span></div>
  </div>
</div>
</body></html>
